<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Elevated Highway Car Sim - Full Traffic & Road</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0f1a;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 8px;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loader">Loading street_light.glb Model...</div>
    <div id="hud">Speed: <span id="speed-display" style="color: #ffcc00;">0</span> MPH</div>
    <div id="instructions">Use <strong>W/A/S/D</strong> or <strong>Arrow Keys</strong> to Drive.</div>

    <!-- Load Three.js, GLTFLoader, and DRACOLoader via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // --- Applied Configuration ---
        const config = {
            "scale": 0.02,
            "left": {
                "x": -10.5,
                "y": 15,
                "z": 0,
                "rotY": 0
            },
            "right": {
                "x": 10.5,
                "y": 15,
                "z": 0,
                "rotY": 180
            },
            "spacing": 122.5
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd97757); 
        scene.fog = new THREE.FogExp2(0xd97757, 0.0018); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffb380, 0.7));
        const directionalLight = new THREE.DirectionalLight(0xff6600, 0.9);
        directionalLight.position.set(100, 30, 50);
        scene.add(directionalLight);

        // --- Player Car State ---
        const car = {
            position: new THREE.Vector3(0, 15 + 0.5, -60), 
            angle: Math.PI,        
            speed: 0,              
            maxSpeed: 1.65,        
            accelerationRate: 0.0055, 
            brakingRate: 0.009,
            friction: 0.004       
        };
        
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // --- Road & Environment Setup ---
        const roadWidth = 26; 
        const roadLength = 2500;
        const bridgeHeight = 15; 

        // Main Elevated Highway Deck
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, bridgeHeight, 0);
        scene.add(road);

        // Center dividers / lanes visual detail
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lineGeo = new THREE.PlaneGeometry(0.4, roadLength);
        const centerLine = new THREE.Mesh(lineGeo, lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.set(0, bridgeHeight + 0.02, 0);
        scene.add(centerLine);

        // Ground Below
        const groundGeo = new THREE.PlaneGeometry(6000, 6000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111c16 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Highway Support Pillars
        const pillarGeo = new THREE.BoxGeometry(2, bridgeHeight, 2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        for (let z = -1200; z <= 1200; z += 100) {
            const pillarL = new THREE.Mesh(pillarGeo, pillarMat);
            pillarL.position.set(-8, bridgeHeight / 2, z);
            scene.add(pillarL);

            const pillarR = new THREE.Mesh(pillarGeo, pillarMat);
            pillarR.position.set(8, bridgeHeight / 2, z);
            scene.add(pillarR);
        }

        // --- Player Car Model ---
        const playerCar = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(1.8, 1, 3.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 }); 
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.5;
        playerCar.add(carBody);
        
        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        [-0.95, 0.95].forEach(x => {
            [-1.2, 1.2].forEach(z => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(x, 0.4, z);
                playerCar.add(wheel);
            });
        });

        playerCar.position.copy(car.position);
        scene.add(playerCar);

        // --- Traffic Cars Setup ---
        const trafficCars = [];
        const trafficColors = [0xcc2222, 0x2222cc, 0x22cc22, 0xcccccc, 0x111111, 0xff8800];
        const trafficGeo = new THREE.BoxGeometry(1.8, 1, 3.8);

        for (let i = 0; i < 25; i++) {
            const isLaneLeft = Math.random() > 0.5;
            const tMat = new THREE.MeshStandardMaterial({ color: trafficColors[Math.floor(Math.random() * trafficColors.length)] });
            const tMesh = new THREE.Mesh(trafficGeo, tMat);
            
            const tCar = {
                mesh: tMesh,
                position: new THREE.Vector3(
                    isLaneLeft ? -5 : 5,
                    bridgeHeight + 0.5,
                    (Math.random() - 0.5) * 2000
                ),
                speed: 0.4 + Math.random() * 0.6,
                direction: isLaneLeft ? -1 : 1 // Traffic flowing in respective lanes
            };
            
            tMesh.position.copy(tCar.position);
            scene.add(tMesh);
            trafficCars.push(tCar);
        }

        // --- Load Street Light .GLB Model ---
        const lightPoleGroup = [];
        const totalLightPoles = 60;
        let baseStreetlightModel = null;

        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('./street_light.glb', (gltf) => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').remove(), 500);
            baseStreetlightModel = gltf.scene;
            rebuildStreetlights();
        }, undefined, (error) => {
            console.warn('GLB load error. Fallback cubes activated.', error);
            document.getElementById('loader').innerText = 'Model failed to load. Check file name.';
            setTimeout(() => document.getElementById('loader').remove(), 2000);
            baseStreetlightModel = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 7, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            rebuildStreetlights();
        });

        function rebuildStreetlights() {
            if (!baseStreetlightModel) return;

            lightPoleGroup.forEach(l => scene.remove(l.mesh));
            lightPoleGroup.length = 0;

            for (let i = 0; i < totalLightPoles; i++) {
                const zPos = (i * config.spacing) - (totalLightPoles * config.spacing / 2);

                const leftInst = baseStreetlightModel.clone();
                scene.add(leftInst);
                lightPoleGroup.push({ mesh: leftInst, side: 'left', originalZ: zPos });

                const rightInst = baseStreetlightModel.clone();
                scene.add(rightInst);
                lightPoleGroup.push({ mesh: rightInst, side: 'right', originalZ: zPos });
            }
            updateStreetlightTransforms();
        }

        function updateStreetlightTransforms() {
            lightPoleGroup.forEach(item => {
                const sideCfg = config[item.side];
                item.mesh.scale.set(config.scale, config.scale, config.scale);
                item.mesh.position.set(sideCfg.x, sideCfg.y + bridgeHeight - 15, item.originalZ + sideCfg.z);
                
                let normalizedRot = sideCfg.rotY % 360;
                if (normalizedRot < 0) normalizedRot += 360;
                item.mesh.rotation.y = THREE.MathUtils.degToRad(normalizedRot);
            });
        }

        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Driving Controls & Physics
            let accelerating = keys['ArrowUp'] || keys['w'] || keys['W'];
            let reversing = keys['ArrowDown'] || keys['s'] || keys['S'];

            if (accelerating) {
                car.speed = Math.max(car.speed - car.accelerationRate, -car.maxSpeed);
            } else if (reversing) {
                car.speed = Math.min(car.speed + car.brakingRate, car.maxSpeed * 0.5);
            } else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction);
                if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction);
            }

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) car.angle += 0.025;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) car.angle -= 0.025;

            car.position.x -= Math.sin(car.angle) * car.speed;
            car.position.z -= Math.cos(car.angle) * car.speed;
            
            // Keep player bounded on bridge width
            car.position.x = Math.max(-roadWidth / 2 + 2, Math.min(roadWidth / 2 - 2, car.position.x));

            playerCar.position.copy(car.position);
            playerCar.rotation.y = car.angle;

            // Chase Camera
            camera.position.x = car.position.x - Math.sin(car.angle) * 12;
            camera.position.y = bridgeHeight + 4;
            camera.position.z = car.position.z - Math.cos(car.angle) * 12;
            camera.lookAt(car.position.x + Math.sin(car.angle) * 10, bridgeHeight + 0.8, car.position.z + Math.cos(car.angle) * 10);

            // Update HUD Speedometer
            document.getElementById('speed-display').innerText = Math.round(Math.abs(car.speed) * 65);

            // Update Traffic Simulation
            trafficCars.forEach(t => {
                t.position.z += t.speed * t.direction;
                if (t.position.z > car.position.z + 1200) t.position.z -= 2400;
                if (t.position.z < car.position.z - 1200) t.position.z += 2400;
                t.mesh.position.copy(t.position);
                t.mesh.rotation.y = t.direction > 0 ? 0 : Math.PI;
            });

            // Infinite Street Light Looping relative to Player
            lightPoleGroup.forEach(l => {
                const totalSpan = totalLightPoles * config.spacing;
                if (l.mesh.position.z > car.position.z + 150) {
                    l.originalZ -= totalSpan;
                } else if (l.mesh.position.z < car.position.z - totalSpan + 150) {
                    l.originalZ += totalSpan;
                }
                const sideCfg = config[l.side];
                l.mesh.position.z = l.originalZ + sideCfg.z;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
