<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dual-Carriageway Highway Sim</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #D35400;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 8px;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loader">Loading Assets...</div>
    <div id="hud">Controller/Wheel: <span id="controller-status" style="color: #ff5555;">Not Detected (Press any button/wheel pedal)</span></div>
    <div id="instructions">Use <strong>W/S</strong> or Pedals to accelerate/brake. Use <strong>A/D</strong> or Wheel to steer. Center median double-stone-davit streetlights, AMC Matador Sedan traffic models, continuous opposite AI traffic.</div>

    <!-- Load Three.js, GLTFLoader, DRACOLoader, and JSZip via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/JSZip.js"></script>

    <script>
        // --- Streetlight Config (Center Median Double-Sided) ---
        const streetlightConfig = {
            "scale": 0.02,
            "center": { "x": 0, "y": 15 - 15, "z": 0, "rotY": 0 },
            "spacing": 122.5
        };

        // --- Scene Setup with Sunset Atmosphere ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xD35400); 
        scene.fog = new THREE.FogExp2(0xD35400, 0.001); 

        // Sunset Sky Dome
        const skyGeo = new THREE.SphereGeometry(2500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x8E44AD) },
                middleColor: { value: new THREE.Color(0xE67E22) },
                bottomColor: { value: new THREE.Color(0xC0392B) }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 middleColor;
                uniform vec3 bottomColor;
                varying vec3 vWorldPosition;
                void main() {
                    float py = normalize(vWorldPosition).y;
                    vec3 color;
                    if (py > 0.0) {
                        color = mix(middleColor, topColor, pow(py, 0.6));
                    } else {
                        color = mix(middleColor, bottomColor, pow(abs(py), 0.6));
                    }
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            side: THREE.BackSide
        });
        const skyDome = new THREE.Mesh(skyGeo, skyMat);
        scene.add(skyDome);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Warm Sunset Lighting
        const ambientLight = new THREE.AmbientLight(0xffb74d, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xff5722, 1.2);
        directionalLight.position.set(-300, 150, -300);
        scene.add(directionalLight);

        // --- Car Variables ---
        const bridgeHeight = 15; 
        const car = {
            position: new THREE.Vector3(0, bridgeHeight + 0.5, -60), 
            angle: Math.PI,        
            speed: 0,              
            maxSpeed: 1.65,        
            accelerationRate: 0.0055, 
            brakingRate: 0.009,
            friction: 0.004,       
            steeringInput: 0       
        };
        
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // --- Gamepad / Steering Wheel Integration ---
        let gamepadConnected = false;
        window.addEventListener("gamepadconnected", (e) => {
            gamepadConnected = true;
            document.getElementById('controller-status').innerText = `Connected: ${e.gamepad.id}`;
            document.getElementById('controller-status').style.color = '#55ff55';
        });
        window.addEventListener("gamepaddisconnected", (e) => {
            gamepadConnected = false;
            document.getElementById('controller-status').innerText = "Disconnected";
            document.getElementById('controller-status').style.color = '#ff5555';
        });

        // --- Load Textures ---
        const textureLoader = new THREE.TextureLoader();
        
        // Road Texture
        const roadTexture = textureLoader.load(
            'https://cdn.cgbookcase.cloud/file/cgbookcase/textures/downloads/Three_lane_road_clean_01/Three_lane_road_clean_01_1K_Height.png',
            (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(40, 1); 
                texture.center.set(0.5, 0.5);
                texture.rotation = Math.PI / 2; 
                texture.generateMipmaps = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                texture.needsUpdate = true;
            }
        );

        // --- Transparent PNG Barrier Textures ---
        const barrierHeight = 3.0 * 0.5; 
        const roadLength = 3500;

        const leftBarrierTexture = textureLoader.load(
            'https://yt3.ggpht.com/P_LsazD7dQwNYDwJITca7yCz8er77QIzgIuMxy4fAmFTaQQvMKtYA-ab-5Ya0-AHmFQf6ixSqJPllA=s612-rw-nd-v1',
            (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(120, 1); 
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.generateMipmaps = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                texture.needsUpdate = true;
            }
        );

        const rightBarrierTexture = textureLoader.load(
            'https://yt3.ggpht.com/_3Clp_kHSSj41OKTv_CHRbSXXOtx5S1xQutOxXYYRJrO8RFbxqe_cQAUIOdXVBgFKHgZw3AY-wVWXg=s600-rw-nd-v1',
            (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                
                texture.image = texture.image || {};
                const updateRepeat = (img) => {
                    const aspect = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1.5;
                    const tileWidthWorld = barrierHeight * aspect; 
                    const repeats = (roadLength / tileWidthWorld) * 1.05;
                    texture.repeat.set(repeats, 1.02);
                    texture.offset.set(0, -0.01);
                    texture.needsUpdate = true;
                };
                
                if (texture.image.complete) {
                    updateRepeat(texture.image);
                } else {
                    texture.image.onload = () => updateRepeat(texture.image);
                }

                texture.colorSpace = THREE.SRGBColorSpace;
                texture.generateMipmaps = true;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                texture.needsUpdate = true;
            }
        );

        // --- Grass Texture ---
        const grassImg = new Image();
        grassImg.crossOrigin = "anonymous";
        grassImg.src = "https://tse1.mm.bing.net/th/id/OIP.izPAaDMt80oHJfPYnQM9xQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
        
        const grassTexture = new THREE.CanvasTexture();
        grassImg.onload = () => {
            const canvas = document.createElement('canvas');
            const subSize = 512;
            canvas.width = subSize;
            canvas.height = subSize;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(grassImg, 0, 0, subSize, subSize);

            ctx.globalCompositeOperation = 'overlay';
            const grad = ctx.createRadialGradient(subSize*0.3, subSize*0.7, 10, subSize*0.3, subSize*0.7, subSize*0.6);
            grad.addColorStop(0, 'rgba(180, 140, 90, 0.45)'); 
            grad.addColorStop(0.5, 'rgba(140, 105, 60, 0.25)'); 
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, subSize, subSize);

            grassTexture.image = canvas;
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.colorSpace = THREE.SRGBColorSpace;
            grassTexture.generateMipmaps = true;
            grassTexture.minFilter = THREE.LinearMipmapLinearFilter;
            grassTexture.magFilter = THREE.LinearFilter;
            grassTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            grassTexture.needsUpdate = true;
        };

        // --- Layout Architecture ---
        const roadWidth = 21;
        const outerGrassWidth = 350; 
        const medianGrassWidth = 6.0;

        const leftOldFenceX = -60; 
        const forwardRoadX = leftOldFenceX + (roadWidth / 2);
        const forwardRightNewFenceX = forwardRoadX + (roadWidth / 2);
        const medianGrassX = forwardRightNewFenceX + (medianGrassWidth / 2);
        const backwardLeftNewFenceX = medianGrassX + (medianGrassWidth / 2);
        const backwardRoadX = backwardLeftNewFenceX + (roadWidth / 2);
        const rightOldFenceX = backwardRoadX + (roadWidth / 2);

        const leftOuterGrassX = forwardRoadX - (roadWidth / 2) - (outerGrassWidth / 2);
        const rightOuterGrassX = backwardRoadX + (roadWidth / 2) + (outerGrassWidth / 2);

        const leftOuterBackgroundFenceX = leftOuterGrassX - (outerGrassWidth / 2);
        const rightOuterBackgroundFenceX = rightOuterGrassX + (outerGrassWidth / 2);

        const roadMat = new THREE.MeshStandardMaterial({ 
            map: roadTexture,
            roughness: 0.8,
            polygonOffset: true,
            polygonOffsetFactor: -4.0,
            polygonOffsetUnits: -4.0
        });
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);

        // 1. Forward Road
        const roadForward = new THREE.Mesh(roadGeo, roadMat);
        roadForward.rotation.x = -Math.PI / 2;
        roadForward.position.set(forwardRoadX, bridgeHeight + 0.01, 0);
        scene.add(roadForward);

        // 2. Backward (Opposite) Road
        const roadBackward = new THREE.Mesh(roadGeo, roadMat);
        roadBackward.rotation.x = -Math.PI / 2;
        roadBackward.position.set(backwardRoadX, bridgeHeight + 0.01, 0);
        scene.add(roadBackward);

        // --- Road Barrier Fences ---
        const barrierLength = roadLength + 2.0; 
        const barrierGeo = new THREE.PlaneGeometry(barrierLength, barrierHeight);
        const barrierHeightOffset = -0.6 * 0.5;

        const oldFenceMat = new THREE.MeshStandardMaterial({ 
            map: leftBarrierTexture, 
            transparent: true,
            alphaTest: 0.05, 
            roughness: 0.5,
            side: THREE.DoubleSide 
        });

        const newFenceMat = new THREE.MeshStandardMaterial({ 
            map: rightBarrierTexture, 
            transparent: true,
            alphaTest: 0.05, 
            roughness: 0.5,
            side: THREE.DoubleSide 
        });

        const leftOldFence = new THREE.Mesh(barrierGeo, oldFenceMat);
        leftOldFence.position.set(leftOldFenceX, bridgeHeight + (barrierHeight / 2) + barrierHeightOffset, 0); 
        leftOldFence.rotation.y = Math.PI / 2;
        scene.add(leftOldFence);

        const forwardRightNewFence = new THREE.Mesh(barrierGeo, newFenceMat);
        forwardRightNewFence.position.set(forwardRightNewFenceX, bridgeHeight + (barrierHeight / 2) + barrierHeightOffset, 0); 
        forwardRightNewFence.rotation.y = -Math.PI / 2;
        scene.add(forwardRightNewFence);

        const backwardLeftNewFence = new THREE.Mesh(barrierGeo, newFenceMat);
        backwardLeftNewFence.position.set(backwardLeftNewFenceX, bridgeHeight + (barrierHeight / 2) + barrierHeightOffset, 0); 
        backwardLeftNewFence.rotation.y = Math.PI / 2;
        scene.add(backwardLeftNewFence);

        const rightOldFence = new THREE.Mesh(barrierGeo, oldFenceMat);
        rightOldFence.position.set(rightOldFenceX, bridgeHeight + (barrierHeight / 2) + barrierHeightOffset, 0); 
        rightOldFence.rotation.y = Math.PI / 2;
        scene.add(rightOldFence);

        // --- Double-Size Outer Background Fences ---
        const bgFenceHeight = barrierHeight * 2; 
        const bgFenceGeo = new THREE.PlaneGeometry(barrierLength, bgFenceHeight);
        const bgFenceHeightOffset = -1.2 * 0.5; 

        const leftOuterBgFence = new THREE.Mesh(bgFenceGeo, newFenceMat);
        leftOuterBgFence.position.set(leftOuterBackgroundFenceX, bridgeHeight + (bgFenceHeight / 2) + bgFenceHeightOffset, 0);
        leftOuterBgFence.rotation.y = Math.PI / 2;
        scene.add(leftOuterBgFence);

        const rightOuterBgFence = new THREE.Mesh(bgFenceGeo, newFenceMat);
        rightOuterBgFence.position.set(rightOuterBackgroundFenceX, bridgeHeight + (bgFenceHeight / 2) + bgFenceHeightOffset, 0);
        rightOuterBgFence.rotation.y = Math.PI / 2;
        scene.add(rightOuterBgFence);

        // --- Sparse Roofless Warehouses and 1/30 Skyscraper Mega-Factories ---
        const factoryX = (forwardRoadX - roadWidth / 2) - 45;
        const factoryGroup = [];
        const greyShades = [0x555555, 0x666666, 0x777777, 0x4a4a4a, 0x5e5e5e, 0x6c7a89];
        
        const factorySpacing = 160;
        const totalFactories = 45;
        const totalSpan = totalFactories * factorySpacing;

        for (let i = 0; i < totalFactories; i++) {
            const zPos = (i * factorySpacing) - (totalSpan / 2) + (Math.random() * 40 - 20);
            
            const roll = Math.random();
            const isSkyscraperMega = (roll < 1/30); 
            const isWarehouse = (!isSkyscraperMega && roll < (1/30 + 1/7)); 

            if (!isSkyscraperMega && !isWarehouse) {
                continue; 
            }

            const fWidth = isSkyscraperMega ? (90 + Math.random() * 40) : (35 + Math.random() * 30); 
            const fHeight = isSkyscraperMega ? ((110 + Math.random() * 70) * (2/3) * (2/3)) : ((12 + Math.random() * 10) * (2/3)); 
            const fLength = isSkyscraperMega ? (300 + Math.random() * 200) : (70 + Math.random() * 50); 

            const wallColor = greyShades[Math.floor(Math.random() * greyShades.length)];
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: wallColor,
                roughness: 0.85,
                side: THREE.DoubleSide 
            });

            const factoryGroupMesh = new THREE.Group();
            const wallThickness = 1.2;

            const frontWallGeo = new THREE.BoxGeometry(fWidth, fHeight, wallThickness);
            const frontWall = new THREE.Mesh(frontWallGeo, wallMat);
            frontWall.position.set(0, fHeight / 2, fLength / 2);
            factoryGroupMesh.add(frontWall);

            const backWall = new THREE.Mesh(frontWallGeo, wallMat);
            backWall.position.set(0, fHeight / 2, -fLength / 2);
            factoryGroupMesh.add(backWall);

            const sideWallGeo = new THREE.BoxGeometry(wallThickness, fHeight, fLength - (wallThickness * 2));
            const leftWall = new THREE.Mesh(sideWallGeo, wallMat);
            leftWall.position.set(-fWidth / 2 + wallThickness / 2, fHeight / 2, 0);
            factoryGroupMesh.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeo, wallMat);
            rightWall.position.set(fWidth / 2 - wallThickness / 2, fHeight / 2, 0);
            factoryGroupMesh.add(rightWall);

            factoryGroupMesh.position.set(factoryX - (fWidth / 2), bridgeHeight, zPos);
            scene.add(factoryGroupMesh);
            factoryGroup.push({ mesh: factoryGroupMesh, baseZ: zPos, span: totalSpan });
        }

        // --- Grass Tiling via Segment Pools ---
        const grassSegmentLength = 200.0;
        const grassOverlap = 0.5;
        const actualGrassSegLen = grassSegmentLength + grassOverlap;
        const segmentsPerSide = Math.ceil(roadLength / grassSegmentLength) + 4;

        const grassMatLeft = new THREE.MeshStandardMaterial({ 
            map: grassTexture, color: 0x8D9E42, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: 4.0, polygonOffsetUnits: 4.0 
        });
        const grassMatMedian = new THREE.MeshStandardMaterial({ 
            map: grassTexture, color: 0x8D9E42, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: 4.0, polygonOffsetUnits: 4.0 
        });
        const grassMatRight = new THREE.MeshStandardMaterial({ 
            map: grassTexture, color: 0x8D9E42, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: 4.0, polygonOffsetUnits: 4.0 
        });

        const tileScale = 15.0;
        const updateMatRepeats = (mat, w, l) => {
            if (mat.map) {
                mat.map.wrapS = THREE.RepeatWrapping;
                mat.map.wrapT = THREE.RepeatWrapping;
                mat.map.repeat.set(w / tileScale, l / tileScale);
                mat.map.needsUpdate = true;
            }
        };

        const leftGrassSegments = [];
        const medianGrassSegments = [];
        const rightGrassSegments = [];

        const leftSegGeo = new THREE.PlaneGeometry(outerGrassWidth, actualGrassSegLen);
        const medianSegGeo = new THREE.PlaneGeometry(medianGrassWidth, actualGrassSegLen);
        const rightSegGeo = new THREE.PlaneGeometry(outerGrassWidth, actualGrassSegLen);

        const startZOffset = -roadLength / 2 - 400;

        for (let i = 0; i < segmentsPerSide; i++) {
            const zPos = startZOffset + (i * grassSegmentLength);

            const lg = new THREE.Mesh(leftSegGeo, grassMatLeft);
            lg.rotation.x = -Math.PI / 2;
            lg.position.set(leftOuterGrassX, bridgeHeight - 0.02, zPos);
            scene.add(lg);
            leftGrassSegments.push(lg);

            const mg = new THREE.Mesh(medianSegGeo, grassMatMedian);
            mg.rotation.x = -Math.PI / 2;
            mg.position.set(medianGrassX, bridgeHeight - 0.02, zPos);
            scene.add(mg);
            medianGrassSegments.push(mg);

            const rg = new THREE.Mesh(rightSegGeo, grassMatRight);
            rg.rotation.x = -Math.PI / 2;
            rg.position.set(rightOuterGrassX, bridgeHeight - 0.02, zPos);
            scene.add(rg);
            rightGrassSegments.push(rg);
        }

        setTimeout(() => {
            updateMatRepeats(grassMatLeft, outerGrassWidth, actualGrassSegLen);
            updateMatRepeats(grassMatMedian, medianGrassWidth, actualGrassSegLen);
            updateMatRepeats(grassMatRight, outerGrassWidth, actualGrassSegLen);
        }, 150);

        // Bridge Support Pillars Pool
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x4d4d4d });
        const pillarGeo = new THREE.BoxGeometry(1.5, bridgeHeight, 1.5);
        const pillars = [];
        const pillarSpacing = 80;
        const totalPillars = 40;

        for (let i = 0; i < totalPillars; i++) {
            [forwardRoadX - roadWidth/2 + 2, forwardRoadX + roadWidth/2 - 2, backwardRoadX - roadWidth/2 + 2, backwardRoadX + roadWidth/2 - 2].forEach(xOffset => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                const zPos = (i * pillarSpacing) - (totalPillars * pillarSpacing / 2);
                pillar.position.set(xOffset, bridgeHeight / 2, zPos);
                scene.add(pillar);
                pillars.push(pillar);
            });
        }

        // --- Lanes Setup ---
        const playerLaneCoordinates = [forwardRoadX - 4.5, forwardRoadX, forwardRoadX + 4.5];
        const oncomingLaneCoordinates = [backwardRoadX - 4.5, backwardRoadX, backwardRoadX + 4.5];

        // Fallback Player/AI Car Mesh Generator (used while GLB loads or if missing)
        function createFallbackCarMesh(colorHex = 0xffcc00) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.8, 1, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex }); 
            const carBody = new THREE.Mesh(bodyGeo, bodyMat);
            carBody.position.y = 0.5;
            group.add(carBody);

            const frontGeo = new THREE.BoxGeometry(1.2, 0.3, 0.4);
            const frontMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const carFront = new THREE.Mesh(frontGeo, frontMat);
            carFront.position.set(0, 0.5, -1.8); 
            group.add(carFront);
            return group;
        }

        // Initialize Player Car with Fallback first
        const playerCar = createFallbackCarMesh(0xffcc00);
        playerCar.position.copy(car.position);
        scene.add(playerCar);

        // AI Traffic Containers
        const aiCars = [];
        const aiColors = [0xcc3333, 0x3366cc, 0x228833, 0xcc6600, 0x9933cc, 0xe6e6e6];

        // Populate placeholder AI meshes immediately so simulation runs instantly
        playerLaneCoordinates.forEach((laneX, laneIndex) => {
            for (let i = 0; i < 20; i++) {
                const aiMesh = createFallbackCarMesh(aiColors[Math.floor(Math.random() * aiColors.length)]);
                const initialZ = (i * 60) - 400 + (Math.random() * 20);
                aiMesh.position.set(laneX, bridgeHeight + 0.5, initialZ);
                scene.add(aiMesh);
                
                aiCars.push({
                    mesh: aiMesh,
                    laneIndex: laneIndex,        
                    currentLaneX: laneX,
                    targetLaneIndex: laneIndex,
                    targetLaneX: laneX,
                    isChangingLane: false,
                    laneChangeProgress: 0,
                    forwardSpeed: (1.2 + Math.random() * 0.6) * 0.9,
                    isOncoming: false
                });
            }
        });

        oncomingLaneCoordinates.forEach((laneX, laneIndex) => {
            for (let i = 0; i < 45; i++) {
                const aiMesh = createFallbackCarMesh(aiColors[Math.floor(Math.random() * aiColors.length)]);
                const initialZ = (i * 70) - 1500 + (Math.random() * 40);
                aiMesh.position.set(laneX, bridgeHeight + 0.5, initialZ);
                aiMesh.rotation.y = Math.PI; 
                scene.add(aiMesh);
                
                aiCars.push({
                    mesh: aiMesh,
                    laneIndex: laneIndex,        
                    currentLaneX: laneX,
                    targetLaneIndex: laneIndex,
                    targetLaneX: laneX,
                    isChangingLane: false,
                    laneChangeProgress: 0,
                    forwardSpeed: (1.2 + Math.random() * 0.6) * 0.9,
                    isOncoming: true
                });
            }
        });

        // --- Load Assets (Streetlights Zip & AMC Matador Sedan GLB) ---
        const lightPoleGroup = [];
        const totalLightPoles = 35;
        const zipUrl = './double_stone_davit_streetlight.zip';
        const carGlbUrl = './amc_matador_sedan.glb';

        let loadedCarTemplate = null;

        function applyCarModel(sceneObj) {
            loadedCarTemplate = sceneObj;
            
            // Update Player Car
            scene.remove(playerCar);
            const newPlayerMesh = loadedCarTemplate.clone();
            newPlayerMesh.scale.set(1.2, 1.2, 1.2);
            playerCar.children = newPlayerMesh.children;
            playerCar.position.copy(car.position);
            scene.add(playerCar);

            // Update all AI cars
            aiCars.forEach(ai => {
                const pos = ai.mesh.position.clone();
                const rotY = ai.mesh.rotation.y;
                scene.remove(ai.mesh);

                const newAiMesh = loadedCarTemplate.clone();
                newAiMesh.scale.set(1.2, 1.2, 1.2);
                newAiMesh.position.copy(pos);
                newAiMesh.rotation.y = rotY;
                scene.add(newAiMesh);
                ai.mesh = newAiMesh;
            });
        }

        // Load Car GLB
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load(carGlbUrl, (gltf) => {
            applyCarModel(gltf.scene);
        }, undefined, (err) => {
            console.warn('Could not load amc_matador_sedan.glb directly, checking zip or falling back to geometric boxes:', err);
        });

        // Load Streetlights Zip
        fetch(zipUrl)
            .then(res => {
                if (!res.ok) throw new Error('ZIP fetch failed');
                return res.arrayBuffer();
            })
            .then(data => JSZip.loadAsync(data))
            .then(zip => {
                let gltfFileEntry = null;
                const imageFiles = {};
                let carGltfEntry = null;

                const filePromises = [];
                zip.forEach((relativePath, zipEntry) => {
                    if (zipEntry.dir) return;
                    const lowerName = relativePath.toLowerCase();
                    if (lowerName.includes('matador') && (lowerName.endsWith('.gltf') || lowerName.endsWith('.glb'))) {
                        carGltfEntry = zipEntry;
                    } else if (lowerName.endsWith('.gltf') || lowerName.endsWith('.glb')) {
                        gltfFileEntry = zipEntry;
                    } else if (lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg')) {
                        filePromises.push(
                            zipEntry.async('blob').then(blob => {
                                const filename = relativePath.split('/').pop();
                                imageFiles[filename] = URL.createObjectURL(blob);
                            })
                        );
                    }
                });

                return Promise.all(filePromises).then(() => {
                    const manager = new THREE.LoadingManager();
                    manager.setURLModifier(url => {
                        const filename = url.split('/').pop();
                        if (imageFiles[filename]) {
                            return imageFiles[filename];
                        }
                        return url;
                    });

                    const loader = new THREE.GLTFLoader(manager);

                    if (carGltfEntry) {
                        carGltfEntry.async('text').then(text => {
                            loader.parse(text, '', (gltf) => {
                                applyCarModel(gltf.scene);
                            });
                        });
                    }

                    if (gltfFileEntry) {
                        return gltfFileEntry.async('text').then(gltfText => {
                            loader.parse(gltfText, '', (gltf) => {
                                setupStreetlights(gltf.scene);
                            }, err => {
                                console.error('GLTF Parse Error:', err);
                                fallbackStreetlights();
                            });
                        });
                    } else {
                        throw new Error('Streetlight file not found in zip');
                    }
                });
            })
            .catch(err => {
                console.warn('ZIP extraction failed for streetlights, attempting direct load:', err);
                const directLoader = new THREE.GLTFLoader();
                directLoader.load('./double_stone_davit_streetlight.gltf', (gltf) => {
                    setupStreetlights(gltf.scene);
                }, undefined, () => {
                    fallbackStreetlights();
                });
            });

        function setupStreetlights(baseModel) {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').remove(), 500);

            baseModel.scale.set(
                streetlightConfig.scale, 
                streetlightConfig.scale, 
                streetlightConfig.scale
            );

            for (let i = 0; i < totalLightPoles; i++) {
                const zOffset = (i * streetlightConfig.spacing) - (totalLightPoles * streetlightConfig.spacing / 2);

                const centerInstance = baseModel.clone();
                centerInstance.position.set(
                    medianGrassX + streetlightConfig.center.x, 
                    bridgeHeight + streetlightConfig.center.y, 
                    zOffset + streetlightConfig.center.z
                );
                centerInstance.rotation.y = THREE.MathUtils.degToRad(streetlightConfig.center.rotY);
                scene.add(centerInstance);
                lightPoleGroup.push({ mesh: centerInstance, baseZ: zOffset });
            }
        }

        function fallbackStreetlights() {
            console.warn('Procedural center streetlights activated.');
            document.getElementById('loader').innerText = 'Model failed to load. Using fallback.';
            setTimeout(() => document.getElementById('loader').remove(), 2000);

            for (let i = 0; i < totalLightPoles; i++) {
                const zOffset = (i * streetlightConfig.spacing) - (totalLightPoles * streetlightConfig.spacing / 2);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
                const postGeo = new THREE.BoxGeometry(0.3, 7, 0.3);

                const post = new THREE.Mesh(postGeo, poleMat);
                post.position.set(medianGrassX, bridgeHeight + 3.5, zOffset);
                scene.add(post);
                lightPoleGroup.push({ mesh: post, baseZ: zOffset });
            }
        }

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            let throttleInput = 0;
            let brakeInput = 0;
            let steeringAxis = 0;

            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    gp = gamepads[i];
                    break;
                }
            }

            if (gp) {
                if (!gamepadConnected) {
                    gamepadConnected = true;
                    document.getElementById('controller-status').innerText = `Connected: ${gp.id}`;
                    document.getElementById('controller-status').style.color = '#55ff55';
                }

                steeringAxis = gp.axes[0] || 0;

                if (gp.axes.length > 3) {
                    let rawThrottle = gp.axes[2] !== undefined ? gp.axes[2] : 0;
                    let rawBrake = gp.axes[3] !== undefined ? gp.axes[3] : 0;
                    throttleInput = (1 - rawThrottle) / 2; 
                    brakeInput = (1 - rawBrake) / 2;
                } else {
                    throttleInput = gp.buttons[7] && gp.buttons[7].pressed ? gp.buttons[7].value : 0;
                    brakeInput = gp.buttons[6] && gp.buttons[6].pressed ? gp.buttons[6].value : 0;
                }
            }

            let accelerating = keys['ArrowUp'] || keys['w'] || keys['W'] || throttleInput > 0.1;
            let reversing = keys['ArrowDown'] || keys['s'] || keys['S'] || brakeInput > 0.1;

            if (accelerating) {
                let currentMag = Math.abs(car.speed);
                let pedalFactor = throttleInput > 0 ? throttleInput : 1.0;
                let dynamicAccel = car.accelerationRate * (1.0 - (currentMag / car.maxSpeed) * 0.7) * pedalFactor;
                car.speed -= dynamicAccel;
                car.speed = Math.max(car.speed, -car.maxSpeed);
            } else if (reversing) {
                let currentMag = Math.abs(car.speed);
                let pedalFactor = brakeInput > 0 ? brakeInput : 1.0;
                let dynamicAccel = car.brakingRate * pedalFactor;
                car.speed += dynamicAccel;
                car.speed = Math.min(car.speed, car.maxSpeed * 0.5);
            } else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction);
                if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction);
            }

            let steerPressed = false;
            let steerDir = 0;

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                steerPressed = true;
                steerDir = -1;
                car.steeringInput = Math.min(1.0, car.steeringInput + 0.12);
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                steerPressed = true;
                steerDir = 1;
                car.steeringInput = Math.min(1.0, car.steeringInput + 0.12);
            } else if (Math.abs(steeringAxis) > 0.05) {
                steerPressed = true;
                steerDir = Math.sign(steeringAxis);
                car.steeringInput = Math.min(1.0, Math.abs(steeringAxis));
            } else {
                car.steeringInput = Math.max(0.0, car.steeringInput - 0.2);
            }

            let targetDegrees = 0;
            if (car.steeringInput > 0) {
                if (car.steeringInput < 0.33) targetDegrees = 0.5;
                else if (car.steeringInput < 0.66) targetDegrees = 2.0;
                else targetDegrees = 5.0;
            }

            const currentTurnRate = THREE.MathUtils.degToRad(targetDegrees) * 0.08;

            if (steerPressed) {
                car.angle += steerDir * currentTurnRate * (car.speed !== 0 ? Math.sign(car.speed) : 1);
            }

            car.position.x -= Math.sin(car.angle) * car.speed;
            car.position.z -= Math.cos(car.angle) * car.speed;

            const margin = 0.5;
            const leftRoadBound = forwardRoadX - roadWidth / 2 + margin;
            const rightRoadBound = forwardRoadX + roadWidth / 2 - margin;
            if (car.position.x < leftRoadBound) {
                car.position.x = leftRoadBound;
                car.speed = 0;
            }
            if (car.position.x > rightRoadBound) {
                car.position.x = rightRoadBound;
                car.speed = 0;
            }

            playerCar.position.copy(car.position);
            playerCar.rotation.y = car.angle;

            skyDome.position.copy(car.position);

            const roadSpan = roadLength;
            if (car.position.z < roadForward.position.z - roadSpan / 2 + 500) {
                roadForward.position.z -= roadSpan;
                roadBackward.position.z -= roadSpan;
                leftOldFence.position.z = roadForward.position.z;
                forwardRightNewFence.position.z = roadForward.position.z;
                backwardLeftNewFence.position.z = roadForward.position.z;
                rightOldFence.position.z = roadForward.position.z;
                leftOuterBgFence.position.z = roadForward.position.z;
                rightOuterBgFence.position.z = roadForward.position.z;
            } else if (car.position.z > roadForward.position.z + roadSpan / 2 - 500) {
                roadForward.position.z += roadSpan;
                roadBackward.position.z += roadSpan;
                leftOldFence.position.z = roadForward.position.z;
                forwardRightNewFence.position.z = roadForward.position.z;
                backwardLeftNewFence.position.z = roadForward.position.z;
                rightOldFence.position.z = roadForward.position.z;
                leftOuterBgFence.position.z = roadForward.position.z;
                rightOuterBgFence.position.z = roadForward.position.z;
            }

            // Endless Infinity Loop for Grass Segments with 0.5 Overlap
            const totalSegSpan = segmentsPerSide * grassSegmentLength;
            for (let i = 0; i < segmentsPerSide; i++) {
                const segs = [leftGrassSegments[i], medianGrassSegments[i], rightGrassSegments[i]];
                segs.forEach(seg => {
                    if (seg.position.z > car.position.z + grassSegmentLength * 1.5) {
                        seg.position.z -= totalSegSpan;
                    } else if (seg.position.z < car.position.z - totalSegSpan + grassSegmentLength * 1.5) {
                        seg.position.z += totalSegSpan;
                    }
                });
            }

            pillars.forEach(pillar => {
                const totalSpanPillars = totalPillars * pillarSpacing;
                if (pillar.position.z > car.position.z + 150) {
                    pillar.position.z -= totalSpanPillars;
                } else if (pillar.position.z < car.position.z - totalSpanPillars + 150) {
                    pillar.position.z += totalSpanPillars;
                }
            });

            const totalSpanLights = totalLightPoles * streetlightConfig.spacing;
            lightPoleGroup.forEach(l => {
                if (l.mesh.position.z > car.position.z + 200) {
                    l.mesh.position.z -= totalSpanLights;
                } else if (l.mesh.position.z < car.position.z - totalSpanLights + 200) {
                    l.mesh.position.z += totalSpanLights;
                }
            });

            // Loop Buildings
            factoryGroup.forEach(f => {
                if (f.mesh.position.z > car.position.z + 600) {
                    f.mesh.position.z -= f.span;
                } else if (f.mesh.position.z < car.position.z - f.span + 600) {
                    f.mesh.position.z += f.span;
                }
            });

            aiCars.forEach(aiCar => {
                const laneCoords = aiCar.isOncoming ? oncomingLaneCoordinates : playerLaneCoordinates;

                if (aiCar.isOncoming) {
                    aiCar.mesh.position.z += aiCar.forwardSpeed;
                } else {
                    aiCar.mesh.position.z -= aiCar.forwardSpeed;
                }

                if (aiCar.isChangingLane) {
                    aiCar.laneChangeProgress += 0.022; 
                    let t = aiCar.laneChangeProgress;

                    const expT = Math.pow(t, 2.2) / (Math.pow(t, 2.2) + Math.pow(1 - t, 2.2));
                    aiCar.mesh.position.x = THREE.MathUtils.lerp(aiCar.currentLaneX, aiCar.targetLaneX, expT);

                    const laneChangeDirection = Math.sign(aiCar.targetLaneX - aiCar.currentLaneX);
                    aiCar.mesh.rotation.y = (aiCar.isOncoming ? Math.PI : 0) - laneChangeDirection * 0.1 * Math.sin(t * Math.PI);

                    if (aiCar.laneChangeProgress >= 1) {
                        aiCar.laneIndex = aiCar.targetLaneIndex;
                        aiCar.currentLaneX = aiCar.targetLaneX;
                        aiCar.mesh.position.x = aiCar.currentLaneX;
                        aiCar.mesh.rotation.y = aiCar.isOncoming ? Math.PI : 0; 
                        aiCar.isChangingLane = false;
                    }
                } else {
                    aiCar.mesh.position.x = aiCar.currentLaneX;
                    aiCar.mesh.rotation.y = aiCar.isOncoming ? Math.PI : 0;

                    if (Math.random() < 0.04) {
                        let obstacleAhead = null;
                        let minDistance = 30;

                        aiCars.forEach(other => {
                            if (other !== aiCar && other.isOncoming === aiCar.isOncoming && other.laneIndex === aiCar.laneIndex) {
                                const dist = aiCar.isOncoming ? (other.mesh.position.z - aiCar.mesh.position.z) : (aiCar.mesh.position.z - other.mesh.position.z);
                                if (dist > 0 && dist < minDistance) {
                                    minDistance = dist;
                                    obstacleAhead = other;
                                }
                            }
                        });

                        if (!aiCar.isOncoming) {
                            const distToPlayer = aiCar.mesh.position.z - car.position.z;
                            if (distToPlayer < 0 && distToPlayer > -30 && Math.abs(aiCar.mesh.position.x - car.position.x) < 2.5) {
                                obstacleAhead = playerCar;
                            }
                        }

                        const speedDifferenceThreshold = 0.12; 
                        const obstacleSpeed = obstacleAhead === playerCar ? car.speed : (obstacleAhead ? obstacleAhead.forwardSpeed : 0);

                        if (obstacleAhead && (aiCar.forwardSpeed - obstacleSpeed >= speedDifferenceThreshold)) {
                            const adjacentLaneIndices = [];
                            if (aiCar.laneIndex > 0) adjacentLaneIndices.push(aiCar.laneIndex - 1);
                            if (aiCar.laneIndex < laneCoords.length - 1) adjacentLaneIndices.push(aiCar.laneIndex + 1);

                            adjacentLaneIndices.sort(() => Math.random() - 0.5);

                            for (let targetIdx of adjacentLaneIndices) {
                                const targetX = laneCoords[targetIdx];
                                let targetLaneIsSafe = true;

                                aiCars.forEach(other => {
                                    if (other !== aiCar && other.isOncoming === aiCar.isOncoming && other.laneIndex === targetIdx) {
                                        const distZ = Math.abs(aiCar.mesh.position.z - other.mesh.position.z);
                                        if (distZ < 15) targetLaneIsSafe = false;
                                    }
                                });

                                if (targetLaneIsSafe) {
                                    aiCar.targetLaneIndex = targetIdx;
                                    aiCar.targetLaneX = targetX;
                                    aiCar.isChangingLane = true;
                                    aiCar.laneChangeProgress = 0;
                                    break;
                                }
                            }
                        }
                    }
                }

                // Seamless Continuous Recycling for both directions
                if (!aiCar.isOncoming && aiCar.mesh.position.z > car.position.z + 80) {
                    aiCar.mesh.position.z = car.position.z - 900 - Math.random() * 100;
                    const randomLaneIdx = Math.floor(Math.random() * playerLaneCoordinates.length);
                    aiCar.laneIndex = randomLaneIdx;
                    aiCar.currentLaneX = playerLaneCoordinates[randomLaneIdx];
                    aiCar.targetLaneIndex = randomLaneIdx;
                    aiCar.targetLaneX = aiCar.currentLaneX;
                    aiCar.mesh.position.x = aiCar.currentLaneX;
                    aiCar.mesh.rotation.y = 0;
                } else if (aiCar.isOncoming && aiCar.mesh.position.z > car.position.z + 200) {
                    aiCar.mesh.position.z = car.position.z - 1200 - Math.random() * 300;
                    const randomLaneIdx = Math.floor(Math.random() * oncomingLaneCoordinates.length);
                    aiCar.laneIndex = randomLaneIdx;
                    aiCar.currentLaneX = oncomingLaneCoordinates[randomLaneIdx];
                    aiCar.targetLaneIndex = randomLaneIdx;
                    aiCar.targetLaneX = aiCar.currentLaneX;
                    aiCar.mesh.position.x = aiCar.currentLaneX;
                    aiCar.mesh.rotation.y = Math.PI;
                }
            });

            const camDist = 12;
            const camHeight = 4;
            camera.position.x = car.position.x - Math.sin(car.angle) * camDist;
            camera.position.y = bridgeHeight + camHeight;
            camera.position.z = car.position.z - Math.cos(car.angle) * camDist;

            const lookAheadX = car.position.x + Math.sin(car.angle) * 10;
            const lookAheadZ = car.position.z + Math.cos(car.angle) * 10;
            camera.lookAt(lookAheadX, bridgeHeight + 0.8, lookAheadZ);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
